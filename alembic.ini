# Alembic configuration file.

[alembic]
# Path to migration scripts (relative to this file)
script_location = alembic

# Naming convention for generated migration files: <timestamp>_<slug>
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Enable sys.path prepend so alembic can import our app
prepend_sys_path = .

# Timezone for auto-generated migration filenames
timezone = UTC

# Line length for generated migration files
line_length = 100

# Leave the database URL empty — it is set dynamically in alembic/env.py
# from the DATABASE_URL environment variable (or .env file).
sqlalchemy.url =

[post_write_hooks]
# Run ruff format on newly generated migration files
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
